services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: market_user
      # Set POSTGRES_PASSWORD in .env (see .env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: market_pulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    # Команда для запуска миграций и API сервера (Uvicorn)
    command: sh -c "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://market_user:${POSTGRES_PASSWORD}@db:5432/market_pulse_db
      - REDIS_URL=redis://redis:6379/0
      # Distributed scrape worker (S19.5)
      - WORKER_TOKEN=${WORKER_TOKEN}
      # Передача ключа OpenAI из твоего локального .env
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      # Если используешь прокси, добавь переменную сюда тоже
      - PROXY_LIST=${PROXY_LIST}
      # Auth
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      # Telegram (Phase 4)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - TELEGRAM_POLLING=${TELEGRAM_POLLING}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      # SMTP (Phase 4)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      - db
      - redis
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8080"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8080"

  # Reverse proxy + automatic Let's Encrypt HTTPS.
  # Routes:
  #   marketpulse1.me/api/* → app:8000  (FastAPI)
  #   marketpulse1.me/*     → frontend:8080 (Vite)
  # Direct 8000/8080 host ports are kept open for fallback / worker access,
  # but normal users hit https://marketpulse1.me (port 443).
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config: