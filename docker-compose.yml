services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: market_user
      POSTGRES_PASSWORD: market_password
      POSTGRES_DB: market_pulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    # Продакшен команда: создание таблиц и переход в режим сна (ожидание ручного запуска скрейпера)
    command: sh -c "alembic upgrade head && tail -f /dev/null"
    # ports:
    #   - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://market_user:market_password@db:5432/market_pulse_db
      - REDIS_URL=redis://redis:6379/0
      # Передача ключа OpenAI из твоего локального .env
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      # Если используешь прокси, добавь переменную сюда тоже
      - PROXY_LIST=${PROXY_LIST}
    depends_on:
      - db
      - redis

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8080"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8080"

volumes:
  postgres_data: