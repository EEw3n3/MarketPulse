services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: market_user
      POSTGRES_PASSWORD: market_password
      POSTGRES_DB: market_pulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    # Команда "tail -f /dev/null" держит контейнер запущенным, 
    # чтобы ты мог внутри него запускать скрипты вручную.
    command: tail -f /dev/null 
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://market_user:market_password@db:5432/market_pulse_db
      - REDIS_URL=redis://redis:6379/0
      # Передача ключа OpenAI из твоего локального .env
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Если используешь прокси, добавь переменную сюда тоже
      - PROXY_LIST=${PROXY_LIST}
    depends_on:
      - db
      - redis

volumes:
  postgres_data: