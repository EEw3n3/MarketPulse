name: CI

# Runs on every push to main and on pull requests. It needs no secrets:
# the checks only read the code.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # the same version as the Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q app scripts alembic

      - name: Import smoke test
        run: python -c "import app.api.main"
        env:
          # ai_generator creates its Gemini client at import time and refuses an
          # empty key. This placeholder is not a secret and is never used.
          GOOGLE_API_KEY: ci-placeholder

      - name: Alembic has a single head
        run: test "$(alembic heads | wc -l)" -eq 1

      - name: Lint (syntax errors and undefined names)
        run: |
          pip install ruff==0.16.10
          ruff check --select E9,F63,F7,F82 app scripts alembic

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
